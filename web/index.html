<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TikPrint</title>
<style>
:root{
  --bg:#e8e7e4; --dot:#9c9a95; --dot-hot:#6a6864;
  --ink:#1c1c1e; --muted:#7a7873; --line:#d2d0cb;
  --card:#f4f3f0; --hover:rgba(28,28,30,.05);
  --btn:#1c1c1e; --btn-ink:#fff; --ok:#2e9d5b; --warn:#d98a1f; --bad:#d64545;
  --paper:#fff; --paper-ink:#111;
  --col:440px;   /* width of the centre column: toolbar, ticket, drop box, buttons */
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141517; --dot:#4a4d52; --dot-hot:#7d8086;
  --ink:#ececec; --muted:#8e9095; --line:#2f3236;
  --card:#1e2023; --hover:rgba(255,255,255,.06);
  --btn:#ececec; --btn-ink:#141517; --paper:#f6f5f2;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
#grid{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

/* ---------- Transparent menu bar ---------- */
.menubar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:6px;padding:14px 20px;transition:background .2s}
.logo{display:flex;align-items:center;gap:8px;font:600 15px var(--sans);letter-spacing:-.01em;margin-right:auto}
.mitem{background:transparent;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:8px;font-size:14px;color:var(--muted)}
.mitem:hover,.mitem.on{color:var(--ink);background:transparent}
.led{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.led.off{background:none;border:1.5px solid var(--muted)}
.led.warn{background:var(--warn)} .led.bad{background:var(--bad)}

/* ---------- Main ---------- */
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:96px 20px 80px}

/* the ticket you type on */
.paper{width:var(--col);background:var(--paper);color:var(--paper-ink);padding:22px 22px 30px;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.04),0 12px 30px rgba(0,0,0,.08);font-family:Helvetica,Arial,sans-serif;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/10px 8px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/10px 8px repeat-x}
/* Printing: the ticket flies up and off the top of the screen (--away is set to the distance when Print is pressed). */
@keyframes fly{to{transform:translateY(var(--away))}}
.paper.out{animation:fly var(--feed,.8s) cubic-bezier(.55,0,.7,.4) forwards}
.paper.back{animation:fly .4s cubic-bezier(.2,.8,.2,1) reverse}   /* printing failed: the same ticket drops back in */
/* Then a fresh ticket rises out of the top edge of the "Drop JPG, PNG, or PDF" box below it.
   It starts shifted down by its own height and is cut off at the box's top edge (22px under the ticket's
   resting place = the box's margin), so it appears to grow up out of that line. */
@keyframes rollout{
  from{transform:translateY(calc(100% + 22px));clip-path:inset(-60px -60px 100% -60px);opacity:0}
  15%{opacity:1}
  to{transform:translateY(0);clip-path:inset(-60px -60px -22px -60px);opacity:1}
}
.paper.in{animation:rollout .55s cubic-bezier(.2,.75,.25,1)}
@media (prefers-reduced-motion:reduce){.paper.out,.paper.back,.paper.in{animation-duration:.01s}}
.p-head{display:flex;justify-content:space-between;gap:10px;font:700 10px "Inter",Helvetica,Arial,sans-serif;letter-spacing:.03em;color:#999;white-space:nowrap;margin:-4px -6px 0;padding:4px 6px;border-radius:5px;cursor:pointer;outline:none;transition:background .12s,color .12s}
.p-head:hover{color:#666}
/* The header is "selected" (click it): the toolbar's font menu then changes the header's font */
.p-head.sel{background:rgba(0,0,0,.07);color:#333}
/* ...and no text cursor blinks in the ticket meanwhile: the toolbar is working on the header, not on the text */
.paper.hdrsel #doc{caret-color:transparent}
.p-head span:first-child{overflow:hidden;text-overflow:ellipsis}
/* The text you type. #doc is laid out at the paper's real size (576 px = 576 printer dots) and
   shrunk to fit the ticket on screen, so lines break exactly where they will on paper. */
/* overflow:clip, not hidden: a "hidden" box can still scroll inside itself, which pushed the first line out of view */
.docwrap{margin-top:14px;overflow:clip;cursor:text}
#doc{width:576px;min-height:150px;transform-origin:0 0;outline:none;font:400 28px/1.35 "Inter",Helvetica,Arial,sans-serif;white-space:pre-wrap;overflow-wrap:break-word}
/* faded hint on an empty Title / body line. It sits inside the line, so it follows that line's font and size. */
#doc>.blank::before{content:attr(data-ph);color:#bbb;position:absolute;pointer-events:none}
/* A picture inside the text: a line of its own that you can type above and below. It is shown as the
   exact dots that will print. Its ✕ is drawn by CSS so that it is not part of the ticket's text. */
#doc>.pic{position:relative;margin:6px 0;line-height:0;cursor:default;user-select:none;-webkit-user-select:none}
#doc>.pic canvas{display:block;width:576px}
#doc>.pic .rm{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);cursor:pointer}
#doc>.pic .rm::before{content:"✕";color:#fff;font:400 17px/32px Helvetica,Arial,sans-serif}

/* formatting toolbar */
.tools{width:var(--col);margin-bottom:12px;display:flex;align-items:center;gap:4px;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.tools select{height:30px;min-width:0;border:0;border-radius:6px;background:transparent;color:var(--ink);font-size:13px;padding:0 4px;outline:none;cursor:pointer}
.tools select:hover,.tools select:focus-visible{background:var(--hover)}
#fFont{flex:1}
#fSize{width:58px;flex:none}
.tools button{width:30px;height:30px;flex:none;border-radius:6px;font-size:14px;color:var(--ink);display:grid;place-items:center}
.tools button:hover{background:var(--hover)}
.tools button.on{background:var(--btn);color:var(--btn-ink)}
.tools .sep{width:1px;height:18px;flex:none;background:var(--line);margin:0 2px}
/* While the ticket header is selected only the font menu applies to it: the rest of the toolbar steps back */
.tools.hdr button,.tools.hdr #fSize{opacity:.28;pointer-events:none}
.tools.hdr button.on{background:none;color:var(--ink)}   /* bold / alignment say nothing about the header: don't light them up */
.p-img{position:relative;margin-top:10px;display:none}
.p-img.on{display:block}
/* same width as the text above it: both are 576 printer dots wide */
.p-img canvas{display:block;width:100%}
.p-img .p-wait{display:none;padding:26px 0;text-align:center;font:600 12px Helvetica,Arial,sans-serif;color:#999}
.p-img.busy canvas,.p-img.busy .p-note,.p-img.busy .p-nav{display:none}
.p-img.turning canvas{opacity:.3}
.p-nav{display:none;margin-top:10px;align-items:center;justify-content:center;gap:10px;font:700 10px Helvetica,Arial,sans-serif;letter-spacing:.06em;color:#666}
.p-nav.on{display:flex}
.p-nav button{font:700 18px/1 Helvetica,Arial,sans-serif;padding:4px 10px;color:#444;border-radius:6px}
.p-nav button:disabled{opacity:.25}
.p-img.busy .p-wait{display:block}
.p-note{margin-top:8px;text-align:center;font:700 10px Helvetica,Arial,sans-serif;letter-spacing:.06em;color:#999}
.p-note:empty{display:none}
.p-img>button{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:22px}
.p-src{display:none;margin-top:10px;font:700 10px Helvetica,Arial,sans-serif;letter-spacing:.06em;color:#999}
.p-src.on{display:flex;justify-content:space-between}
.p-src button{color:#999;font:inherit}

/* upload area */
.drop{width:var(--col);margin-top:22px;height:76px;border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:14px;transition:.15s;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--ink);color:var(--ink)}
.drop input{display:none}

/* action row */
.row{width:var(--col);margin-top:12px;display:flex;align-items:center;gap:8px}
.dd{position:relative}
.ddbtn{height:40px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:10px;display:inline-flex;align-items:center;gap:8px;font-size:14px;background:var(--bg)}
.ddbtn:hover,.dd.open .ddbtn{border-color:var(--ink)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.12);display:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.dd.open .menu,.pop.open{display:block;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mi{width:100%;white-space:nowrap;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;text-align:left}
.mi:hover{background:var(--hover)}
.mi .ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--sans);color:#fff;flex:none}
.mi .r{margin-left:auto;font-size:12px;color:var(--muted)}
.mi .r.ok{color:var(--ok)}
.sep{height:1px;background:var(--line);margin:5px 4px}
.print{margin-left:auto;height:40px;padding:0 18px;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.print:disabled{opacity:.4;cursor:default}
/* Quiet note under the Print button, only while the printer has a problem */
.pnote{width:var(--col);margin-top:14px;text-align:center;font-size:13px;color:var(--muted);line-height:1.5}
.pnote[hidden]{display:none}
.pnote b{color:var(--ink);font-weight:600}
.pnote .led{display:inline-block;margin-right:7px;vertical-align:1px}

/* ---------- Popovers from menu bar ---------- */
.pop{max-height:calc(100vh - 76px);overflow-y:auto;position:fixed;top:56px;right:20px;z-index:11;width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.14);display:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pop h3{font-size:13px;font-weight:600;color:var(--muted);margin:6px 10px 6px}
.net .mi .bars{display:inline-flex;gap:2px;align-items:flex-end}
.net .mi .bars i{width:3px;background:currentColor;border-radius:1px}
.net.dim .mi{opacity:.4;cursor:default}
.net.dim .mi:hover{background:none}
.pw{display:none;gap:6px;padding:2px 6px 8px}
.net.open .pw{display:flex}
.pw input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:transparent;outline:none}
.pw input:focus{border-color:var(--ink)}
.pw input.bad{border-color:#c2412d}
.pw button{height:34px;padding:0 12px;border-radius:8px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:13px}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ok-state{display:none;padding:14px 10px 10px;text-align:center}
.ok-state .c{width:36px;height:36px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 10px}
.ok-state b{display:block;font-size:15px}
.ok-state code{display:inline-block;margin-top:8px;font:13px var(--mono);padding:6px 10px;border:1px dashed var(--line);border-radius:8px}
.ok-state .link{display:block;margin:12px auto 0;color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;padding:9px 10px;font-size:14px}
.kv span:last-child{color:var(--muted);font:13px var(--mono)}
.kv{align-items:center}
.kv input[type=text]{width:160px;text-align:right;border:0;border-radius:6px;background:transparent;font:13px var(--mono);color:var(--ink);outline:none;padding:5px 7px;margin:-5px -7px -5px 0;transition:background .12s}
.kv input[type=text]::placeholder{color:var(--muted)}
.kv input[type=text]:hover,.kv input[type=text]:focus{background:var(--hover)}
/* Settings: each group of rows is a titled box, with hairlines between its rows */
#gearPop{width:320px}
#gearMain h3{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin:14px 10px 6px}
#gearMain h3:first-child{margin-top:6px}
.grp{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grp .kv{padding:10px 12px}
.grp .kv:not([hidden])~.kv{border-top:1px solid var(--line)}
.grp button.kv{border-radius:0}
.kv span.go{font:15px var(--sans);color:var(--muted)}
label.kv{cursor:pointer}
/* On/off switch */
.sw{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;transition:.15s;margin:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw:checked{background:var(--ok)} .sw:checked::after{left:14px}
.note{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:14px;color:var(--muted)}
.kv[hidden]{display:none}
/* A settings row you can press (Check for updates, Install from file) */
button.kv{width:100%;border-radius:8px;text-align:left}
button.kv:hover{background:var(--hover)}
/* Sheet: a firmware update takes over the Settings popover */
.sheet{display:none;padding:18px 10px 10px;text-align:center}
.sheet .c{width:36px;height:36px;border-radius:50%;background:var(--hover);color:var(--ink);display:grid;place-items:center;margin:0 auto 10px}
.sheet .c.ok{background:var(--ok);color:#fff}
.sheet .c.bad{background:var(--bad);color:#fff}
.sheet b{display:block;font-size:15px}
.sheet p{margin:4px 6px 0;font-size:13px;line-height:1.4;color:var(--muted)}
.sheet p:empty{display:none}
.sheet .bar+p{margin-top:0;font-variant-numeric:tabular-nums}   /* the percentage, right under the bar */
.sheet .link{display:block;margin:10px auto 0;color:var(--muted);font-size:13px}
.sheet .link:hover{color:var(--ink)}
.sheet .btn{display:block;width:calc(100% - 20px);height:36px;margin:16px auto 0;border-radius:9px;background:var(--btn);color:var(--btn-ink);font-size:14px;font-weight:600}
/* Upload progress */
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:16px 10px 8px}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--ink);transition:width .25s}
/* The right-hand side of the "Check for updates" row: a short note in words, not in the code font */
.kv span.say{display:inline-flex;align-items:center;gap:7px;font:13px var(--sans);color:var(--muted)}
/* A green dot on the gear while newer firmware is waiting */
#gearBtn{position:relative}
#gearBtn.new::after{content:"";position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.ok-state .link+.link{margin-top:6px}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;background:var(--btn);color:var(--btn-ink);padding:9px 14px;border-radius:10px;font-size:14px;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Disconnected screen ---------- */
#offline{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
#offline .card{background:var(--bg);padding:22px 28px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
#offline svg{color:var(--muted)}
#offline b{font-size:17px;font-weight:600;letter-spacing:-.01em}
#offline span{color:var(--muted);font-size:14px;max-width:260px}
body.offline #offline{display:flex}
body.offline main,body.offline .menubar .mitem,body.offline .pop,body.offline .toast{display:none!important}

@media (max-width:500px){ .paper,.drop,.row,.tools,.pnote{width:100%} .menubar .mitem .t{display:none} }
</style>
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>

<!-- Transparent menu bar -->
<header class="menubar" id="bar">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="8" width="18" height="9" rx="2.5"/><path d="M7 8V4h10v4"/><path d="M7 14h10v7l-2.5-1.3L12 21l-2.5-1.3L7 21z"/></svg>
    TikPrint
  </div>
  <span class="mitem" id="usbItem" title="USB-C"><span class="led off" id="usbLed"></span><span class="t">USB-C</span></span>
  <span class="mitem" id="prnItem" title="Printer"><span class="led off" id="prnLed"></span><span class="t">Printer</span></span>
  <button class="mitem" id="wifiBtn"><span class="led off" id="wifiLed"></span><span class="t" id="wifiLabel">Set up Wi-Fi</span></button>
  <button class="mitem" id="gearBtn" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<!-- Wi-Fi popover -->
<div class="pop" id="wifiPop">
  <div id="netList">
    <h3>Wi-Fi</h3>
    <div id="nets"></div>
  </div>
  <div class="ok-state" id="wifiOk">
    <div class="c"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <b id="okName"></b>
    <code id="okHost">tikprint.local</code><br>
    <code id="okIp"></code>
    <button class="link" id="changeNet">Change network</button>
    <button class="link" id="forgetNet">Forget this network</button>
  </div>
</div>

<!-- Settings popover -->
<div class="pop" id="gearPop">
  <div id="gearMain">
    <h3>Printer</h3>
    <div class="grp">
      <div class="kv"><span>Name</span><span id="setName">tikprint.local</span></div>
      <div class="kv"><span>USB-C</span><span id="setUsb">192.168.7.1</span></div>
      <div class="kv"><span>Clock</span><span id="setClock"></span></div>
    </div>
    <h3>Ticket header</h3>
    <div class="grp">
      <div class="kv"><span>Location</span><input type="text" id="setLoc" maxlength="40" autocomplete="off" spellcheck="false" aria-label="Location"></div>
      <label class="kv"><span>Show location</span><input type="checkbox" class="sw" id="swLoc"></label>
      <label class="kv"><span>Show date</span><input type="checkbox" class="sw" id="swDate"></label>
      <label class="kv"><span>Show time</span><input type="checkbox" class="sw" id="swTime"></label>
    </div>
    <h3>Firmware</h3>
    <div class="grp">
      <div class="kv"><span>Version</span><span id="setFw"></span></div>
      <button class="kv" id="fwCheck"><span id="fwCheckLabel">Check for updates</span><span class="say" id="fwCheckNote"></span></button>
      <button class="kv" id="fwBtn" hidden><span>Install from file</span><span class="go">›</span></button>
    </div>
    <input type="file" id="fwFile" accept=".bin,application/octet-stream" hidden>
  </div>
  <!-- An update's question and progress are shown here, in place of the list above -->
  <div class="sheet" id="sheet" aria-live="polite">
    <div class="c" id="shIco"></div>
    <b id="shTitle"></b>
    <div class="bar" id="shBar"><i></i></div>
    <p id="shText"></p>
    <button class="btn" id="shGo"></button>
    <button class="link" id="shCancel"></button>
  </div>
</div>

<main>
  <!-- Formatting toolbar: works on the selected text, like a word processor -->
  <div class="tools" id="tools">
    <select id="fFont" aria-label="Font"></select>
    <span class="sep"></span>
    <select id="fSize" aria-label="Size in points"></select>
    <span class="sep"></span>

</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Dot grid (same as the assembly page) ---------- */
(() => {
  const c=document.getElementById('grid'), g=c.getContext('2d');
  const m={x:-9999,y:-9999,sx:-9999,sy:-9999,active:0};
  let base=[0,0,0],hot=[0,0,0],W=0,H=0,dpr=1; const SP=16,R=150;
  const SOLID='.tools,.paper,.drop,.ddbtn,.print,.pop.open,.dd.open .menu,.toast.on,body.offline #offline .card';
  const hex=v=>{v=v.trim().replace('#','');return[0,2,4].map(i=>parseInt(v.slice(i,i+2),16))};
  const colors=()=>{const s=getComputedStyle(document.documentElement);base=hex(s.getPropertyValue('--dot'));hot=hex(s.getPropertyValue('--dot-hot'))};
  const size=()=>{dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr};
  (function draw(){
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    m.sx+=(m.x-m.sx)*.18;m.sy+=(m.y-m.sy)*.18;
    const ox=(W%SP)/2,oy=(H%SP)/2;
    // objects the dots stop at (with a small gap so they end cleanly at the edge)
    // slot = the line a fresh ticket rises out of (top of the drop box); while it does, the part still below that line is hidden
    const GAP=5, slot=document.getElementById('drop').getBoundingClientRect().top, rects=[...document.querySelectorAll(SOLID)].filter(el=>el.offsetParent||getComputedStyle(el).position==='fixed').map(el=>{const r=el.getBoundingClientRect();return{left:r.left,right:r.right,top:r.top,bottom:el.id==='paper'?(el.classList.contains('in')?Math.min(r.bottom,slot):r.bottom+8):r.bottom,width:r.width,height:r.height}}).filter(r=>r.width&&r.height&&r.bottom>r.top);
    const blocked=(px,py)=>rects.some(r=>px>r.left-GAP&&px<r.right+GAP&&py>r.top-GAP&&py<r.bottom+GAP);
    for(let y=oy;y<H+SP;y+=SP)for(let x=ox;x<W+SP;x+=SP){
      const dx=x-m.sx,dy=y-m.sy,d=Math.hypot(dx,dy);
      let a=Math.max(0,1-d/R);a=a*a*(3-2*a)*m.active;
      const p=a*7,px=d>0?x+dx/d*p:x,py=d>0?y+dy/d*p:y;
      if(blocked(px,py))continue;
      const col=base.map((v,i)=>Math.round(v+(hot[i]-v)*a*.85));
      g.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${.22+a*.38})`;
      g.beginPath();g.arc(px,py,1+a*1.3,0,Math.PI*2);g.fill();
    }
    requestAnimationFrame(draw);
  })();
  addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY;if(m.sx<-5000){m.sx=m.x;m.sy=m.y}m.active=1},{passive:true});
  document.addEventListener('pointerleave',()=>m.active=0);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',colors);
  addEventListener('resize',size); colors(); size();
})();

const $=id=>document.getElementById(id);
let ticket=1, wifi=null;
const pad=n=>'#'+String(n).padStart(4,'0');
/* ---------- Ticket header ---------- */
/* The line at the top of the ticket, on screen and on paper:
     TikPrint | Los Angeles                 NOV 20, 2026 | 10:05 PM PST
   "TikPrint" is always there. Location, date and time each have a switch in Settings, saved on the board.
   Its font: click the header to select it, then pick a font in the toolbar (see "Header font" further down).
   Date and time are the BOARD's clock in the board's timezone (its last report plus the seconds since),
   not this device's, and are left out while the board's clock isn't set.
   With no location typed in, the city of the timezone is used ("America/Los_Angeles" -> Los Angeles). */
let hdr={location:'',show_location:true,show_date:true,show_time:true,header_font:'Inter'}, tzCity='';
let boardTime=null;   // the board's clock as last reported: {wall: its local time in ms, at: when this page heard it, zone: "PST"}
function headerParts(){
  const now=boardTime?new Date(boardTime.wall+performance.now()-boardTime.at):null, fmt=o=>now.toLocaleString('en-US',{timeZone:'UTC',...o}).toUpperCase();
  const place=hdr.location||tzCity;   // shown as typed
  const date=now&&hdr.show_date?fmt({month:'short',day:'numeric',year:'numeric'}):'';
  const time=now&&hdr.show_time?fmt({hour:'numeric',minute:'2-digit'})+(boardTime.zone?' '+boardTime.zone:''):'';
  return {left:'TikPrint'+(hdr.show_location&&place?' | '+place:''), right:[date,time].filter(Boolean).join(' | ')};
}
const showHeader=()=>{const h=headerParts();$('hLeft').textContent=h.left;$('hRight').textContent=h.right;$('pHead').style.fontFamily=`"${hdr.header_font}",Helvetica,Arial,sans-serif`};
const showDate=showHeader;
showHeader(); setInterval(showHeader,5000);   // keeps the minute current between status updates
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body,ms=4000){
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(path,{signal:ctl.signal,cache:'no-store',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});
    return await r.json();
  }finally{clearTimeout(timer)}
}

/* ---------- Clock ---------- */
/* The board has no clock of its own, so this page lends it the computer's: the time now and
   the timezone, sent when the page opens and every TIME_SEND_MS after. Works over USB with no internet.
   The browser names the timezone the IANA way ("America/Detroit"); the board needs the POSIX rule
   ("EST5EDT,M3.2.0,M11.1.0" = which offset, and when summer time starts and ends). TZ_RULES maps
   one to the other for common zones. Any other zone gets a rule with today's offset and no
   summer-time switch, which this page corrects the next time it is open after the switch. */
const TIME_SEND_MS=5*60*1000;   // how often the page re-sends the time while it is open
const TIME_RETRY_MS=30*1000;    // if the board says its clock isn't set, wait at least this long before re-sending
const TZ_RULES={
  'EST5EDT,M3.2.0,M11.1.0':'America/New_York America/Detroit America/Toronto America/Indiana/Indianapolis America/Kentucky/Louisville',
  'CST6CDT,M3.2.0,M11.1.0':'America/Chicago America/Winnipeg',
  'MST7MDT,M3.2.0,M11.1.0':'America/Denver America/Edmonton America/Boise',
  'MST7':'America/Phoenix',
  'PST8PDT,M3.2.0,M11.1.0':'America/Los_Angeles',
  'AKST9AKDT,M3.2.0,M11.1.0':'America/Anchorage',
  'HST10':'Pacific/Honolulu',
  'AST4ADT,M3.2.0,M11.1.0':'America/Halifax',
  'CST6':'America/Mexico_City',
  '<-05>5':'America/Bogota America/Lima',
  '<-03>3':'America/Sao_Paulo America/Argentina/Buenos_Aires',
  'UTC0':'UTC Etc/UTC',
  'GMT0BST,M3.5.0/1,M10.5.0':'Europe/London',
  'IST-1GMT0,M10.5.0,M3.5.0/1':'Europe/Dublin',
  'WET0WEST,M3.5.0/1,M10.5.0':'Europe/Lisbon',
  'CET-1CEST,M3.5.0,M10.5.0/3':'Europe/Paris Europe/Berlin Europe/Madrid Europe/Rome Europe/Amsterdam Europe/Brussels Europe/Vienna Europe/Zurich Europe/Stockholm Europe/Oslo Europe/Copenhagen Europe/Warsaw Europe/Prague Europe/Budapest',
  'EET-2EEST,M3.5.0/3,M10.5.0/4':'Europe/Athens Europe/Helsinki Europe/Kyiv Europe/Kiev Europe/Bucharest Europe/Sofia',
  '<+03>-3':'Europe/Istanbul Asia/Riyadh',
  'MSK-3':'Europe/Moscow',
  'SAST-2':'Africa/Johannesburg',
  'WAT-1':'Africa/Lagos',
  'EAT-3':'Africa/Nairobi',
  '<+04>-4':'Asia/Dubai',
  'PKT-5':'Asia/Karachi',
  'IST-5:30':'Asia/Kolkata Asia/Calcutta',
  '<+07>-7':'Asia/Bangkok Asia/Ho_Chi_Minh',
  'WIB-7':'Asia/Jakarta',
  '<+08>-8':'Asia/Singapore',
  'HKT-8':'Asia/Hong_Kong',
  'CST-8':'Asia/Shanghai Asia/Taipei',
  'PST-8':'Asia/Manila',
  'KST-9':'Asia/Seoul',
  'JST-9':'Asia/Tokyo',
  'AWST-8':'Australia/Perth',
  'AEST-10':'Australia/Brisbane',
  'AEST-10AEDT,M10.1.0,M4.1.0/3':'Australia/Sydney Australia/Melbourne',
  'ACST-9:30ACDT,M10.1.0,M4.1.0/3':'Australia/Adelaide',
  'NZST-12NZDT,M9.5.0,M4.1.0/3':'Pacific/Auckland',
};
/* A rule for a zone that is not in the table: today's offset, fixed. E.g. 5 h 45 min ahead of UTC -> "<+0545>-5:45"
   (POSIX counts the other way round, hence the flipped sign). */
function fixedTz(){
  const east=-new Date().getTimezoneOffset(), a=Math.abs(east), h=Math.floor(a/60), m=a%60, two=n=>String(n).padStart(2,'0');
  return `<${east<0?'-':'+'}${two(h)}${m?two(m):''}>${east<0?'':'-'}${h}${m?':'+two(m):''}`;
}
function posixTz(iana){
  for(const rule in TZ_RULES)if(TZ_RULES[rule].split(' ').includes(iana))return rule;
  return fixedTz();
}
let clockSet=false, timeSentAt=0;
async function sendTime(){
  timeSentAt=Date.now();
  let zone='UTC'; try{zone=Intl.DateTimeFormat().resolvedOptions().timeZone||zone}catch(e){}
  if(!/^[\w+\-\/]{1,63}$/.test(zone))zone='UTC';
  const posix=zone==='UTC'&&new Date().getTimezoneOffset()?fixedTz():posixTz(zone);
  try{const r=await api('/api/time',{unix_ms:Date.now(),timezone:zone,posix_tz:posix}); if(r.time)showClock(r.time)}catch(e){}
}
/* Settings shows the board's own idea of the time, e.g. "22:05 · Detroit". */
function showClock(t){
  clockSet=!!t.set;
  // "2026-11-20T22:05:31-05:00" -> the 22:05:31 part as a number, so the page can keep counting from it
  const m=t.set&&/^(\d+)-(\d+)-(\d+)T(\d+):(\d+):(\d+)/.exec(t.now);
  boardTime=m?{wall:Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]),at:performance.now(),zone:t.zone||''}:null;
  tzCity=/\//.test(t.timezone)?t.timezone.split('/').pop().replace(/_/g,' '):''; $('setLoc').placeholder=tzCity; showHeader();
  $('setClock').textContent=t.set?t.now.slice(11,16)+' · '+t.timezone.split('/').pop().replace(/_/g,' '):'Not set';
  $('setClock').title=t.set?`From the ${t.source==='internet'?'internet':'browser'}`:'Open this page or connect Wi-Fi to turn on schedules';
}
setInterval(()=>{if(!offline)sendTime()},TIME_SEND_MS);

/* ---------- Header font ---------- */
/* The header is not typed text, so it can't be selected with the cursor like the rest of the ticket.
   Instead: click it (or Tab to it and press Enter) and it lights up as selected. The toolbar's font
   menu then shows and changes the header's font, and the other tools fade out because they don't
   apply to it. Clicking anywhere else goes back to the ticket's text. The font is saved on the board. */
let headerSelected=false;
function selectHeader(on){
  if(on===headerSelected)return; headerSelected=on;
  $('pHead').classList.toggle('sel',on); $('tools').classList.toggle('hdr',on); $('paper').classList.toggle('hdrsel',on);
  // Take the cursor out of the text for good. Without the blur, Safari keeps the text box focused and
  // parks a stray cursor at its very top, in the wrong size, next to the "Title" hint.
  if(on){doc.blur(); getSelection().removeAllRanges(); $('pHead').focus({preventScroll:true}); $('fFont').value=hdr.header_font}
  else showState();   // the toolbar shows the text's style again
}
$('pHead').onclick=()=>selectHeader(true);
$('pHead').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectHeader(true)} if(e.key==='Escape')selectHeader(false)};
document.addEventListener('mousedown',e=>{if(!e.target.closest('#pHead,#tools'))selectHeader(false)});

/* ---------- Settings: ticket header ---------- */
/* The switches and the location live on the board, so every device and every ticket agree.
   A change is sent at once; the board's reply is what the page then shows. */
let savingSettings=0;
function applySettings(x){
  if(savingSettings)return;   // don't let an older status report undo a change that is on its way
  const typing=document.activeElement===$('setLoc');   // keep what is being typed, in the box and in the preview
  x={...x,header_font:FONTS.some(f=>f.name===x.header_font)?x.header_font:FONTS[0].name};   // only fonts the page has
  hdr=typing?{...x,location:$('setLoc').value.trim()}:x; showHeader(); if(headerSelected)$('fFont').value=hdr.header_font;
  if(!typing)$('setLoc').value=x.location;
  $('swLoc').checked=x.show_location; $('swDate').checked=x.show_date; $('swTime').checked=x.show_time;
}
async function saveSettings(change){
  hdr={...hdr,...change}; showHeader();   // show it straight away
  savingSettings++;
  let r=null; try{r=await api('/api/settings',change)}catch(e){}
  savingSettings--;
  if(r&&r.settings){if(!r.ok)toast(r.message||'Couldn’t save that');applySettings(r.settings)}
  else toast('Couldn’t save the setting');
}
$('swLoc').onchange=e=>saveSettings({show_location:e.target.checked});
$('swDate').onchange=e=>saveSettings({show_date:e.target.checked});
$('swTime').onchange=e=>saveSettings({show_time:e.target.checked});
$('setLoc').onchange=e=>saveSettings({location:e.target.value.trim()});
$('setLoc').oninput=e=>{hdr={...hdr,location:e.target.value.trim()};showHeader()};   // live preview while typing
$('setLoc').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};

/* ---------- Printer status ---------- */
/* The board asks the printer how it is every few seconds (this needs the status wire).
   - Menu bar: the "Printer" dot is green when all is well, hollow when the printer doesn't
     answer (no status wire, or it is off), amber or red while there is a problem.
   - Under the Print button: a quiet note, only while there is a problem, saying what it is,
     what to do, and how many tickets are waiting for it.
   "holds" problems keep tickets in the queue until they are fixed; Print still works and adds to the line. */
const PRINTER_PROBLEMS={
  out_of_paper:{text:'Out of paper',hint:'Load a new roll',holds:true},
  cover_open:{text:'Cover open',hint:'Close the cover',holds:true},
  error:{text:'Printer error',hint:'Check the cutter, then switch the printer off and on',led:'bad'},
  offline:{text:'Printer offline',hint:'Check the printer',led:'warn'},
  paper_low:{text:'Paper running low',hint:'Have a new roll ready',led:'warn'},
};
const PRINTER_QUIET={ok:{led:'',title:'Printer ready'}, unknown:{led:'off',title:'Printer status unknown: it doesn’t answer'}};
function showPrinter(p,q){
  const x=PRINTER_PROBLEMS[p.status], quiet=PRINTER_QUIET[p.status]||PRINTER_QUIET.unknown, led=x?(x.led||'bad'):quiet.led;
  $('prnLed').className='led '+led; $('prnItem').title=x?x.text:quiet.title;
  $('prnNote').hidden=!x; if(!x)return;
  const n=q?q.waiting:0, held=x.holds&&n;
  $('prnNoteLed').className='led '+led;
  $('prnWhat').textContent=x.text;
  $('prnHeld').textContent=held?` · ${n} ticket${n>1?'s':''} waiting`:'';
  $('prnHint').textContent=x.hint+(x.holds?(held?(n>1?' and they print by themselves':' and it prints by itself'):' to print'):'');
}

/* ---------- Status (menu bar, ticket number, settings) ---------- */
let viaUsb=false, scanning=false, printing=false, updating=false;   // updating: a firmware update is under way
function applyStatus(s){
  viaUsb=s.via==='usb';
  $('usbLed').classList.toggle('off',!viaUsb);
  $('usbItem').title=viaUsb?'Connected over USB-C':(s.usb_connected?'USB-C is plugged into a computer':'USB-C not connected');
  wifi=s.wifi?s.wifi.ssid:null;
  $('wifiLed').classList.toggle('off',!s.wifi);
  $('wifiLabel').textContent=s.wifi?'Wi-Fi':(s.wifi_connecting?'Connecting…':'Set up Wi-Fi');
  $('wifiBtn').title=s.wifi?`${s.wifi.ssid} · ${s.wifi.ip}`:'';
  ticket=s.ticket_count+1; showDate();
  $('setName').textContent=s.hostname; $('setUsb').textContent=s.usb_ip;
  if(s.update)showFirmware(s); else $('setFw').textContent='v'+s.version;
  $('okHost').textContent=s.hostname;
  // The board forgets the time when it loses power: give it back as soon as it says so (also the very first time).
  if(s.settings)applySettings(s.settings);
  if(s.printer)showPrinter(s.printer,s.print_queue);
  if(s.time){showClock(s.time); if(!s.time.set&&Date.now()-timeSentAt>TIME_RETRY_MS)sendTime()}
  if(s.wifi&&!joining){$('okName').textContent=s.wifi.ssid;$('okIp').textContent=s.wifi.ip}
  return s;
}
let joining=false, misses=0, offline=false;
function setOffline(on){
  if(on===offline)return; offline=on;
  if(on){
    closeAll(null);
    $('offlineHint').textContent=(viaUsb?'Plug the USB-C cable back in.':'Check that the printer has power and is on Wi-Fi.')+' This page reconnects on its own.';
  }
  document.body.classList.toggle('offline',on);
}
async function refreshStatus(){
  try{const s=applyStatus(await api('/api/status',undefined,2500));misses=0;setOffline(false);return s}
  catch(e){return null}
}
/* Heartbeat: a tiny ping every 0.3 s so unplugging shows up right away.
   - The request fails outright (network gone)  -> disconnected immediately.
   - The request just gets no answer in 0.7 s   -> disconnected after two in a row
     (the board may only be busy for a moment). */
async function ping(){
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),700);
  try{await fetch('/api/ping',{signal:ctl.signal,cache:'no-store'});return 'ok'}
  catch(e){return e.name==='AbortError'?'slow':'gone'}
  finally{clearTimeout(timer)}
}
let beats=0;
(async function beat(){
  if(!joining&&!scanning&&!printing&&!updating){   // these keep the board busy: silence then is not "disconnected"
    const r=await ping();
    if(r==='ok'){
      misses=0;
      if(offline||beats++%7===0)await refreshStatus();  // full status every ~2 s, and right after coming back
    }else if(r==='gone'||++misses>=2)setOffline(true);
  }
  setTimeout(beat,300);
})();

/* ---------- Firmware update ---------- */
/* Settings > Firmware:
   - "Check for updates": the board asks GitHub for the latest release of the firmware. If it is newer than
     what is running, the row turns into "Update to v0.3.0" and the gear gets a green dot. Installing it is one
     click: the board downloads the file from GitHub itself, checks it and restarts into it. This page shows
     the download, waits for the board to come back, then reloads itself so you get the new page too.
     The board also checks by itself once a day, so the dot can appear without anyone asking.
   - "Install from file" (only shown over the USB cable) sends a firmware file from this computer instead,
     for trying a build that is not a release yet. Over Wi-Fi the board accepts nothing but a GitHub release.
   The question and the progress are shown as a "sheet" that takes over the Settings popover. */
const UPDATE_UPLOAD_MS=180000;  // give up on a file upload after this long
const UPDATE_BACK_MS=60000;     // how long to wait for the board to come back after an update
const UPDATE_POLL_MS=700;       // how often to ask the board how a check or a download is going
const SVG=d=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const SHEET_ICONS={
  up:SVG('<path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/>'),
  ok:SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  bad:SVG('<path d="M12 7v6M12 17h.01"/>'),
  wait:'<span class="spin"></span>',
};
const sleep=ms=>new Promise(f=>setTimeout(f,ms));
let fw={id:'',slot:'',ver:'',max:4194304,boot:0,up:null}, checking=false, checkFailed=false;

/* From /api/status: which firmware is running ("id" is different for every build),
   and what the board knows about a newer one on GitHub. */
function showFirmware(s){
  const u=s.update;
  fw={id:u.id,slot:u.slot,ver:s.version,max:u.max_bytes||fw.max,boot:s.boot_id,up:u};
  $('setFw').textContent=`v${s.version} · ${u.id.slice(0,7)}`;
  $('setFw').title=`Running from "${u.slot}"`;
  $('fwBtn').hidden=!viaUsb;
  $('gearBtn').classList.toggle('new',!!u.available);
  const busy=u.state==='downloading'||u.state==='restarting';
  $('fwCheckLabel').textContent=busy?`Installing v${u.latest}`:u.available?`Update to v${u.latest}`:'Check for updates';
  $('fwCheckNote').innerHTML=
    checking||u.state==='checking'?'<span class="spin"></span>':
    busy?`${u.progress}%`:
    u.available?'<span class="led"></span>New':
    checkFailed?'Couldn’t check':
    u.checked_s_ago!=null?'Up to date':'<span class="go">›</span>';
}

/* The sheet. o = {icon, tone:'ok'|'bad', title, text, bar:true, go:'Install', cancel:'Not now'} */
function showSheet(o){
  $('gearMain').style.display='none'; $('sheet').style.display='block';
  $('shIco').className='c'+(o.tone?' '+o.tone:''); $('shIco').innerHTML=SHEET_ICONS[o.icon];
  $('shTitle').textContent=o.title; $('shText').textContent=o.text||'';
  $('shBar').style.display=o.bar?'':'none'; $('shBar').firstElementChild.style.width='0';
  $('shGo').style.display=o.go?'':'none'; $('shGo').textContent=o.go||''; $('shGo').onclick=null;
  $('shCancel').style.display=o.cancel?'':'none'; $('shCancel').textContent=o.cancel||''; $('shCancel').onclick=closeSheet;
}
function closeSheet(){$('sheet').style.display='none'; $('gearMain').style.display=''}
function sheetProblem(title,text){showSheet({icon:'bad',tone:'bad',title,text,cancel:'Close'})}
function sheetProgress(percent,text){$('shBar').firstElementChild.style.width=percent+'%'; $('shText').textContent=text}

/* The new firmware is in place and the board is restarting (or about to). Wait for it to come back,
   say how it went, and reload. was = the firmware that was running before. */
async function finishUpdate(was){
  showSheet({icon:'wait',title:'Restarting'});
  const start=Date.now(); let s=null;
  while(!s&&Date.now()-start<UPDATE_BACK_MS){
    await sleep(800);
    // "boot_id" is a new number after every restart
    try{const now=await api('/api/status',undefined,1500); if(now.update&&now.boot_id!==was.boot)s=now}catch(e){}
  }
  updating=false;
  if(!s)return sheetProblem('The printer hasn’t come back','Check that it has power and is on the network. If it stays away, flash it once with the USB cable.');
  applyStatus(s);
  // New firmware always runs from a different slot. Same slot as before = the board gave up on it and went back.
  if(s.update.slot===was.slot)return sheetProblem('Update undone','The new firmware didn’t start properly, so the printer went back to the one it had.');
  showSheet({icon:'ok',tone:'ok',title:`Updated to v${s.version}`});
  await sleep(1800); location.reload();   // the page itself is part of the firmware
}

/* --- From GitHub --- */
$('fwCheck').onclick=async()=>{
  const u=fw.up; if(!u||checking||u.state!=='idle')return;
  if(u.available)return askInstall();
  checking=true; checkFailed=false; $('fwCheckNote').innerHTML='<span class="spin"></span>';
  let r=null, s=null;
  try{r=await api('/api/update/check',{})}catch(e){}
  if(r&&r.ok){do{await sleep(UPDATE_POLL_MS); s=await refreshStatus()}while(s&&s.update.state==='checking')}
  checking=false;
  const now=s&&s.update, problem=!r?'Can’t reach the printer':!r.ok?r.message:!s?'Can’t reach the printer':now.error;
  checkFailed=!!problem;
  if(s)showFirmware(s); else $('fwCheckNote').textContent='Couldn’t check';
  if(problem)toast(problem);
  else if(now.available)askInstall();
  else toast(`v${s.version} is the latest`);
};
function askInstall(){
  const v=fw.up.latest;
  showSheet({icon:'up',title:`Update to v${v}?`,go:'Install',cancel:'Not now'});
  $('shGo').onclick=()=>installFromGithub(v);
}
async function installFromGithub(v){
  const was={...fw};
  let r=null; try{r=await api('/api/update/install',{})}catch(e){}
  if(!r||!r.ok)return sheetProblem('Couldn’t start the update',r?r.message:'Can’t reach the printer.');
  updating=true;   // from here the sheet stays up, and silence from the board means "restarting", not "disconnected"
  showSheet({icon:'up',title:`Installing v${v}`,text:'0%',bar:true});
  for(let silent=0;silent<5;){
    await sleep(UPDATE_POLL_MS);
    let s=null; try{s=await api('/api/status',undefined,2000)}catch(e){}
    if(!s){silent++;continue}
    silent=0;
    const u=s.update;
    if(s.boot_id!==was.boot||u.state==='restarting')break;
    if(u.state==='downloading')sheetProgress(u.progress,u.progress+'%');
    else{updating=false; applyStatus(s); return sheetProblem('Update failed',u.error||'The download didn’t finish. Nothing was changed.')}
  }
  finishUpdate(was);
}

/* --- From a file, over the USB cable --- */
/* XMLHttpRequest rather than fetch, because it reports how much has been sent. */
function uploadFirmware(file,onProgress){
  return new Promise(done=>{
    const x=new XMLHttpRequest(), lost=()=>done({ok:false,message:'Lost contact with the printer during the upload. Nothing was changed.'});
    x.open('POST','/api/update'); x.timeout=UPDATE_UPLOAD_MS;
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total)};
    x.onload=()=>{try{done(JSON.parse(x.responseText))}catch(e){lost()}};
    x.onerror=x.ontimeout=x.onabort=lost;
    x.send(file);
  });
}
async function installFromFile(file){
  updating=true;   // the board answers nothing else while it takes the file, so the heartbeat pauses
  const was={...fw};
  showSheet({icon:'up',title:'Installing from file',text:'0%',bar:true});
  const r=await uploadFirmware(file,p=>sheetProgress((p*100).toFixed(1),Math.round(p*100)+'%'));
  if(!r.ok){updating=false; sheetProblem('Update failed',r.message||'The printer refused the file.'); refreshStatus(); return}
  finishUpdate(was);
}
$('fwBtn').onclick=()=>$('fwFile').click();
$('fwFile').onchange=async e=>{
  const file=e.target.files[0]; e.target.value='';
  if(!file||updating)return;
  // Every ESP32 program file starts with the byte E9. The board checks the rest.
  const first=new Uint8Array(await file.slice(0,1).arrayBuffer())[0];
  if(first!==0xE9||file.size>fw.max){toast('That isn’t a TikPrint firmware file');return}
  installFromFile(file);
};

/* ---------- Upload area ---------- */
/* The printer is 576 dots wide and each dot is either black or white.
   The browser turns the file into exactly those dots, shows them on the ticket,
   and sends the very same dots to the board. So the preview IS the print.
   Everything here is fixed arithmetic: the same file always gives the same dots. */
const PW=576, PMAXH=4096;
/* Numbers to tune once the real printer is here */
const TRIM_WHITE=245;   // lighter than this (0-255) counts as blank paper when trimming margins
const TRIM_PAD=8;       // dots of blank margin kept around the content after trimming
const CLIP_DARK=.001;   // auto-levels: the darkest 0.1% of pixels become pure black
const CLIP_LIGHT=.01;   // auto-levels: the lightest 1% become pure white (cleans up grey paper in scans)
const DOC_SHARE=.9;     // if 90% of pixels are nearly black or nearly white, treat as a document (text, line art)
const DOC_CUT=150;      // document: darker than this becomes a black dot (above 128 keeps thin strokes)
const SHARPEN=.6;       // edge boost before turning greys into dots (0 = off)
const PHOTO_GAMMA=.8;   // photo: below 1 brightens mid-greys, because thermal dots spread and print darker
const PDF_PAGES=300;    // most pages of a PDF we will read
const DOTS_PER_MM=8;    // 203 dots per inch
let imgBits=null;       // the dots on the ticket right now: {height, data: Uint8Array of 72 bytes per row, 1 = black}
/* The uploaded file. One print can be at most PMAXH rows (about 51 cm), so a long file is
   split into "parts" that each fit; you flip through them and print them one after another.
   {parts:[{rows, label, bits}], cur, rows (whole file), note, render(part) → canvas, close()} */
let job=null;
let loadId=0;           // goes up on every upload/removal, so a slow file can't overwrite a newer one

const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
/* Draw part of a picture into a w×h canvas on white. Big reductions go in halving steps,
   which stays sharp in every browser. */
function resample(src,sx,sy,sw,sh,w,h){
  while(sw>w*2){
    const nw=Math.ceil(sw/2), nh=Math.max(1,Math.ceil(sh/2)), c=mkCanvas(nw,nh), g=c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,nw,nh); g.drawImage(src,sx,sy,sw,sh,0,0,nw,nh);
    src=c; sx=0; sy=0; sw=nw; sh=nh;
  }
  const c=mkCanvas(w,h), g=c.getContext('2d',{willReadFrequently:true});
  g.fillStyle='#fff'; g.fillRect(0,0,w,h);            // transparent areas print as white paper
  g.imageSmoothingQuality='high'; g.drawImage(src,sx,sy,sw,sh,0,0,w,h);
  return c;
}
function greys(c){
  const w=c.width, h=c.height, px=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data, v=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)v[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
  return v;
}
/* Where the content is: the box around everything that isn't blank paper, as fractions (0-1) of the canvas. */
function contentBox(c){
  const w=c.width, h=c.height, v=greys(c); let l=w, r=-1, t=h, b=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(v[y*w+x]<TRIM_WHITE){ if(x<l)l=x; if(x>r)r=x; if(y<t)t=y; b=y; }
  return r<0?null:{l:l/w,r:(r+1)/w,t:t/h,b:(b+1)/h};
}
/* Greys → dots. c must be PW wide. */
function rasterize(c){
  const h=c.height, n=PW*h, v=greys(c);
  // 1. auto-levels
  const hist=new Uint32Array(256); for(let i=0;i<n;i++)hist[v[i]|0]++;
  let lo=0, hi=255, acc=0;
  for(acc=0;lo<255&&(acc+=hist[lo])<=n*CLIP_DARK;)lo++;
  for(acc=0;hi>0&&(acc+=hist[hi])<=n*CLIP_LIGHT;)hi--;
  if(hi-lo>=48){const k=255/(hi-lo); for(let i=0;i<n;i++){const x=(v[i]-lo)*k; v[i]=x<0?0:x>255?255:x}}
  // 2. document or photo?
  let ends=0; for(let i=0;i<n;i++)if(v[i]<48||v[i]>207)ends++;
  const doc=ends>=n*DOC_SHARE;
  // 3. sharpen (compare each pixel with the average of its 4 neighbours)
  if(SHARPEN){
    const s=new Float32Array(n);
    for(let y=0;y<h;y++)for(let x=0;x<PW;x++){
      const i=y*PW+x, a=(v[x?i-1:i]+v[x<PW-1?i+1:i]+v[y?i-PW:i]+v[y<h-1?i+PW:i])/4, z=v[i]+SHARPEN*(v[i]-a);
      s[i]=z<0?0:z>255?255:z;
    }
    v.set(s);
  }
  const out=new Uint8Array(PW/8*h), dot=(x,y)=>{out[y*(PW/8)+(x>>3)]|=0x80>>(x&7)};
  if(doc){
    // 4a. document: a clean cut keeps text edges crisp
    for(let y=0;y<h;y++)for(let x=0;x<PW;x++)if(v[y*PW+x]<DOC_CUT)dot(x,y);
  }else{
    // 4b. photo: brighten, then Floyd–Steinberg dithering (greys become patterns of dots),
    //     zig-zagging left-right then right-left so the patterns don't form streaks
    for(let i=0;i<n;i++)v[i]=255*Math.pow(v[i]/255,PHOTO_GAMMA);
    for(let y=0;y<h;y++){
      const d=y&1?-1:1;
      for(let x=d>0?0:PW-1;x>=0&&x<PW;x+=d){
        const i=y*PW+x, old=v[i], val=old<128?0:255, err=old-val, fwd=x+d>=0&&x+d<PW, back=x-d>=0&&x-d<PW;
        if(!val)dot(x,y);
        if(fwd)v[i+d]+=err*7/16;
        if(y+1<h){ if(back)v[i+PW-d]+=err*3/16; v[i+PW]+=err*5/16; if(fwd)v[i+PW+d]+=err/16; }
      }
    }
  }
  return {height:h,data:out};
}
/* Paint the dots on the ticket. White dots stay see-through so the paper colour shows. */
function showBits(b,c=$('prev')){
  c.height=b.height;
  const g=c.getContext('2d'), im=g.createImageData(PW,b.height), d=im.data;
  for(let y=0;y<b.height;y++)for(let x=0;x<PW;x++)if(b.data[y*(PW/8)+(x>>3)]&(0x80>>(x&7))){const i=(y*PW+x)*4; d[i]=d[i+1]=d[i+2]=17; d[i+3]=255}
  g.putImageData(im,0,0);
}

/* Split a list of pieces (each {h: rows}) into parts of at most PMAXH rows. */
function pack(segs){
  const parts=[]; let cur=null;
  for(const g of segs){ if(!cur||cur.rows+g.h>PMAXH)parts.push(cur={segs:[],rows:0,label:'',bits:null}); cur.segs.push(g); cur.rows+=g.h; }
  return parts;
}

/* A picture: trim blank margins, fit to the paper width. */
function pictureJob(im){
  const W=im.naturalWidth, H=im.naturalHeight; let sx=0, sy=0, sw=W, sh=H, whole=null;
  const fullH=Math.round(H*PW/W);
  if(fullH>=1&&fullH<=PMAXH*4){
    whole=resample(im,0,0,W,H,PW,fullH);
    const box=contentBox(whole);
    if(box&&(box.r-box.l<.97||box.b-box.t<.97)){
      const pad=TRIM_PAD/PW*(box.r-box.l)*W;   // TRIM_PAD dots, measured in the picture's own pixels
      sx=Math.max(0,box.l*W-pad); sy=Math.max(0,box.t*H-pad);
      sw=Math.min(W,box.r*W+pad)-sx; sh=Math.min(H,box.b*H+pad)-sy; whole=null;
    }
  }
  const rows=Math.max(1,Math.round(sh*PW/sw)), segs=[];
  for(let y=0;y<rows;y+=PMAXH)segs.push({y,h:Math.min(PMAXH,rows-y)});   // a very tall picture becomes several parts
  const parts=pack(segs), k=sw/PW;                                       // k = picture pixels per printer dot
  return {parts,rows,note:'',render:async p=>{
    const g=p.segs[0];
    return whole&&parts.length===1?whole:resample(im,sx,sy+g.y*k,sw,Math.min(g.h*k,sh-g.y*k),PW,g.h);
  }};
}
const decodeImage=file=>new Promise((ok,no)=>{
  const im=new Image(), u=URL.createObjectURL(file);
  im.onload=()=>{URL.revokeObjectURL(u);ok(im)}; im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('image'))}; im.src=u;
});

/* An SVG is a drawing made of shapes, not of pixels, so it has no fixed size: some files say
   "24 wide" (an icon), some say nothing at all. We rewrite its size to SVG_PX pixels wide (twice
   the paper's dots) before the browser draws it, so it comes out sharp whatever the file said.
   From there on it is treated like any other picture. */
const SVG_PX=PW*2, SVG_MAX_H=16000;
const isSvg=file=>file.type==='image/svg+xml'||/\.svg$/i.test(file.name);
async function decodeSvg(file){
  const root=new DOMParser().parseFromString(await file.text(),'image/svg+xml').documentElement;
  if(root.nodeName.toLowerCase()!=='svg')throw new Error('svg');
  const num=a=>{const v=root.getAttribute(a)||''; return /%/.test(v)?NaN:parseFloat(v)};   // "100%" is not a size
  const box=(root.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  const hasBox=box.length===4&&box.every(isFinite)&&box[2]>0&&box[3]>0;
  const w=num('width')>0?num('width'):hasBox?box[2]:300, h=num('height')>0?num('height'):hasBox?box[3]:150;
  if(!hasBox)root.setAttribute('viewBox',`0 0 ${w} ${h}`);   // without this, a new size would crop the drawing instead of scaling it
  const k=Math.min(SVG_PX/w,SVG_MAX_H/h);
  root.setAttribute('width',Math.max(1,Math.round(w*k))); root.setAttribute('height',Math.max(1,Math.round(h*k)));
  return decodeImage(new Blob([new XMLSerializer().serializeToString(root)],{type:'image/svg+xml'}));
}

/* A PDF: pdf.js (in /vendor, served by the board) draws each page; we trim the margins
   and stack the pages. Loaded only when the first PDF is dropped. */
const PDFJS='4.10.38'; let pdfLib=null;
async function pdfJob(file,alive,progress){
  if(!pdfLib){
    pdfLib=await import('/vendor/pdf.min.mjs?v='+PDFJS);
    pdfLib.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.min.mjs?v='+PDFJS;
  }
  const doc=await pdfLib.getDocument({data:await file.arrayBuffer()}).promise;
  const draw=async(n,scale)=>{
    const page=await doc.getPage(n), vp=page.getViewport({scale}), c=mkCanvas(Math.ceil(vp.width),Math.ceil(vp.height));
    await page.render({canvasContext:c.getContext('2d',{willReadFrequently:true}),viewport:vp}).promise;
    page.cleanup(); return c;
  };
  try{
    // Pass 1: draw every page small, to find where its content is. This also tells us the paper length.
    const N=doc.numPages, n=Math.min(N,PDF_PAGES), pages=[]; let L=1, R=0;
    for(let i=1;i<=n;i++){
      if(n>3)progress(`Reading page ${i} of ${n}…`);
      const vp=(await doc.getPage(i)).getViewport({scale:1}), box=contentBox(await draw(i,PW/vp.width));
      if(!alive()){doc.destroy();return null}
      if(box){ L=Math.min(L,box.l); R=Math.max(R,box.r); pages.push({i,w:vp.width,h:vp.height,box}); }
    }
    progress('Preparing…');
    // Use the same left/right crop on every page so the text is one size throughout. Zoom at most 4x.
    if(R-L<.25){const m=(L+R)/2; L=Math.max(0,Math.min(.75,m-.125)); R=L+.25}
    // Work out where each page's content will sit at the final size
    const segs=[];
    for(const pg of pages){
      const scale=(PW-2*TRIM_PAD)/((R-L)*pg.w), bw=Math.ceil(pg.w*scale), bh=Math.ceil(pg.h*scale);
      const top=Math.max(0,Math.floor(pg.box.t*bh)-TRIM_PAD), bot=Math.min(bh,Math.ceil(pg.box.b*bh)+TRIM_PAD);
      for(let y=top;y<bot;y+=PMAXH)segs.push({i:pg.i,scale,x:Math.round(L*bw)-TRIM_PAD,y,h:Math.min(PMAXH,bot-y)});   // a page too long for one print is sliced
    }
    const parts=pack(segs);
    for(const p of parts){const a=p.segs[0].i, b=p.segs[p.segs.length-1].i; p.label=(a===b?`page ${a}`:`pages ${a}–${b}`)+` of ${N}`}
    return {parts,rows:segs.reduce((t,g)=>t+g.h,0),note:N>n?`only the first ${n} pages`:'',close:()=>doc.destroy(),
      // Pass 2, done when a part is shown: draw its pages at the final size (sharper than drawing then shrinking), crop, stack
      render:async p=>{
        const c=mkCanvas(PW,p.rows), g=c.getContext('2d',{willReadFrequently:true});
        g.fillStyle='#fff'; g.fillRect(0,0,PW,p.rows);
        let y=0, big=null, bigOf=0;
        for(const sg of p.segs){ if(bigOf!==sg.i){big=await draw(sg.i,sg.scale);bigOf=sg.i} g.drawImage(big,sg.x,sg.y,PW,sg.h,0,y,PW,sg.h); y+=sg.h; }
        return c;
      }};
  }catch(e){doc.destroy();throw e}
}

/* How much paper a number of rows uses, e.g. "51 cm (20 in)". */
function paper(rows){
  const mm=rows/DOTS_PER_MM, inch=mm/25.4;
  return (mm<1000?Math.max(1,Math.round(mm/10))+' cm':(mm/1000).toFixed(1)+' m')+' ('+(inch<36?Math.max(1,Math.round(inch))+' in':(inch/12).toFixed(1)+' ft')+')';
}
function drawNav(){
  const j=job; if(!j)return; const n=j.parts.length, p=j.parts[j.cur];
  $('pNav').classList.toggle('on',n>1);
  $('pPart').textContent=`Part ${j.cur+1} of ${n}`+(p.label?' · '+p.label:'');
  $('pPrev').disabled=j.cur===0; $('pNext').disabled=j.cur===n-1;
  $('pNote').textContent=(n>1?`This part ${paper(p.rows)} · whole file ${paper(j.rows)}`:`Paper ${paper(p.rows)}`)+(j.note?' · '+j.note:'');
}
/* Put one part of the file on the ticket. Parts are prepared the first time they are shown, then kept. */
async function showPart(i){
  const j=job, id=loadId, p=j.parts[i], here=()=>id===loadId&&j.cur===i;
  j.cur=i; imgBits=null; $('pImg').classList.add('turning'); drawNav();
  try{
    if(!p.bits){
      const c=await j.render(p); if(!here())return;
      await new Promise(f=>setTimeout(f)); if(!here())return;     // let the screen update first
      p.bits=rasterize(c);
    }
  }catch(e){ if(!here())return; console.error(e); }
  if(!p.bits){ toast('Couldn’t prepare that part'); if($('pImg').classList.contains('busy'))$('rmImg').click(); else $('pImg').classList.remove('turning'); return; }

function closeJob(){ if(job&&job.close)job.close(); job=null; }

/* Files the ticket can take */
const canLoad=file=>file.type==='application/pdf'||/\.pdf$/i.test(file.name)||/^image\/(jpeg|png)$/.test(file.type)||isSvg(file);
/* Where a file goes:
   - a picture (JPG, PNG, SVG) goes INTO the text, at the cursor, as a line of its own. You can type above
     and below it, and add as many as you like. (See "Pictures in the text" in the Editor code.)
   - a PDF, or a picture too tall for that, goes below the text as before, where long files are
     split into parts. */
const INLINE_MAX_ROWS=1600;   // tallest picture that goes into the text (20 cm of paper)
async function loadFile(file){
  if(!file)return;
  if(!canLoad(file)){toast('Use a JPG, PNG, SVG, or PDF');return}
  const pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  let ready=null;
  if(!pdf){
    try{
      ready=pictureJob(await (isSvg(file)?decodeSvg(file):decodeImage(file)));
      if(ready.parts.length===1&&ready.rows<=INLINE_MAX_ROWS){
        insertPic(rasterize(await ready.render(ready.parts[0]))); $('file').value=''; return;
      }
    }catch(e){console.error(e); $('file').value=''; toast('Couldn’t read that image'); return}
  }
  const id=++loadId, alive=()=>id===loadId;
  closeJob(); imgBits=null; $('pWait').textContent='Preparing…'; $('pImg').classList.remove('turning'); $('pImg').classList.add('on','busy');
  let j=ready;
  try{ if(pdf)j=await pdfJob(file,alive,t=>{$('pWait').textContent=t}); }catch(e){ console.error(e); }
  if(!alive()){ if(j&&j.close)j.close(); return; }
  if(!j||!j.parts.length){
    if(j&&j.close)j.close();
    $('pImg').classList.remove('on','busy'); $('file').value='';
    toast(j?'That PDF is blank':'Couldn’t read that PDF'); return;
  }
  job=j; j.cur=0; await showPart(0);
}
$('pPrev').onclick=()=>{ if(job&&job.cur>0)showPart(job.cur-1) };
$('pNext').onclick=()=>{ if(job&&job.cur<job.parts.length-1)showPart(job.cur+1) };

/* Paste (Cmd+V / Ctrl+V): a copied picture, screenshot, or a file copied in Finder lands on the ticket,
   just as if it had been dropped. Copied SVG code ("<svg ...>") counts as a picture too.
   Anything else is ordinary text and is left to the text box. This listens before the text box does
   (the "true" at the end), because a copied file also carries its name as text, which would be typed in. */
document.addEventListener('paste',e=>{
  if(e.target.closest&&e.target.closest('input,select,textarea'))return;   // typing in Settings or a Wi-Fi password
  const cd=e.clipboardData; if(!cd)return;
  let file=[...cd.files].find(canLoad);
  if(!file&&!cd.files.length){
    const text=cd.getData('text/plain').trim();
    if(/^(<\?xml[^>]*>\s*)?(<!--[\s\S]*?-->\s*)*(<!DOCTYPE[^>]*>\s*)?<svg[\s>]/i.test(text)&&/<\/svg>\s*$/i.test(text))file=new File([text],'pasted.svg',{type:'image/svg+xml'});
  }
  if(!file){ if(cd.files.length){e.preventDefault();e.stopPropagation();toast('Use a JPG, PNG, SVG, or PDF')} return; }
  e.preventDefault(); e.stopPropagation(); loadFile(file);
},true);
$('rmImg').onclick=()=>{loadId++;closeJob();imgBits=null;$('pImg').classList.remove('on','busy','turning');$('pNav').classList.remove('on');$('pNote').textContent='';$('file').value=''};

/* The printer's built-in font can't be changed, so the page draws the text itself, as dots.
   The ticket is a small word processor: select text, then pick a font, size or style.
   The font files live on the board (web/fonts), so this works with no internet.
   To add a font: see the note in main/CMakeLists.txt. */
const FONTS=[
  // name shown in the toolbar, file in web/fonts, weights the file holds
  {name:'Inter',          file:'inter',          weight:'100 900'},
  {name:'Source Serif',   file:'source-serif',   weight:'200 900'},
  {name:'Nunito',         file:'nunito',         weight:'200 1000'},
  {name:'Caveat',         file:'caveat',         weight:'400 700'},
  {name:'JetBrains Mono', file:'jetbrains-mono', weight:'100 800'},

const SIZES=[8,9,10,11,12,14,16,18,24,30,36,48];   // sizes offered, in points, true to size on paper
const DOTS_PER_PT=203/72;                          // the printer has 203 dots per inch, a point is 1/72 inch
const TITLE_PX=Math.round(16*DOTS_PER_PT);         // heading size used when a connector fills the ticket

const HDR_SIZE=17;      // the "TikPrint | Los Angeles ... NOV 20, 2026 | 10:05 PM PST" line above it, in dots
const HDR_H=Math.round(HDR_SIZE*1.4)+8;   // room that line takes
const HDR_GAP=24;       // least space between its left and right halves
const TEXT_CUT=140;     // text is drawn in greys; darker than this (0-255) becomes a black dot. Higher = bolder
const TEXT_MAXH=4096;   // most rows of text on one ticket (about 51 cm)
const doc=$('doc');
/* A new ticket starts with a big bold Title line and a normal body line, each with a faded hint. */
const TITLE_HINT='Title';
const titleLine=html=>`<div data-ph="${TITLE_HINT}" style="font-size:${TITLE_PX}px;font-weight:700">${html||'<br>'}</div>`;
const TEMPLATE=titleLine('')+'<div data-ph="Write something…"><br></div>';
let fontsOk=false;      // all font files have arrived from the board
Promise.all(FONTS.map(f=>{const face=new FontFace(f.name,`url(/fonts/${f.file}.woff2)`,{weight:f.weight});document.fonts.add(face);return face.load()}))
  .then(()=>{fontsOk=true},e=>{console.error(e);toast('Couldn’t load the fonts')});

/* Shrink the paper-sized text to the width of the ticket on screen. */
function fit(){
  const k=$('docWrap').clientWidth/PW; if(!k)return;
  doc.style.transform=`scale(${k})`; $('docWrap').style.height=doc.offsetHeight*k+'px';
}
new ResizeObserver(fit).observe(doc); addEventListener('resize',fit); fit();

/* Clicking a toolbar menu takes the cursor out of the text, so remember where it was. */
let savedSel=null, sizePx=Math.round(10*DOTS_PER_PT), sizeHold=null;
document.addEventListener('selectionchange',()=>{
  const sel=getSelection();
  if(sel.rangeCount&&doc.contains(sel.anchorNode)){savedSel=sel.getRangeAt(0).cloneRange();showState()}
});
/* Clean up after the browser's editing commands. */
function tidy(){
  // The browser can only set 7 fixed sizes, as <font size>. Turn those into the real size picked.
  doc.querySelectorAll('font[size]').forEach(el=>{
    el.removeAttribute('size'); el.style.fontSize=sizePx+'px';
    el.querySelectorAll('[style]').forEach(d=>{d.style.fontSize=''});
  });
  // Everything was deleted: start again from the Title + body layout.
  if(!doc.textContent&&!doc.querySelector('.pic')&&(doc.children.length<2||!doc.firstElementChild.dataset.ph)){
    doc.innerHTML=TEMPLATE; if(document.activeElement===doc)caretTo(doc.firstElementChild);
  }
  // Hints. Pressing Enter copies a line, hint included, so only the first line with each hint keeps it.
  const seen=new Set(), few=doc.children.length<=2;
  for(const b of doc.children){
    const ph=b.dataset.ph;
    if(ph&&seen.has(ph))delete b.dataset.ph; else if(ph)seen.add(ph);
    b.classList.toggle('blank',!!b.dataset.ph&&!b.textContent&&(b.dataset.ph===TITLE_HINT||few));
  }
}
doc.addEventListener('input',tidy);
/* Enter in the Title line goes to the body, instead of making a second big bold line. */
doc.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.metaKey||e.ctrlKey||e.isComposing)return;
  const sel=getSelection(), b=lineAt(sel.anchorNode,sel.anchorOffset); if(!b||b.dataset.ph!==TITLE_HINT)return;
  e.preventDefault();
  if(!b.nextElementSibling||b.nextElementSibling.textContent||isPic(b.nextElementSibling))b.insertAdjacentHTML('afterend','<div><br></div>');
  caretTo(b.nextElementSibling); tidy();
});
/* Pasted text comes in plain, so it takes the style at the cursor rather than the web page's. */
doc.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
function setDoc(html){doc.innerHTML=html||TEMPLATE;savedSel=null;pics.clear();tidy()}

/* ---- Pictures in the text ---- */
/* A picture sits in the text as a line of its own (a box the cursor steps over, like in a word
   processor). Type above it, below it, or between two of them; Backspace from the line below removes
   it, and so does its ✕. Its dots are worked out once, when it is added, and kept in "pics";
   printing copies exactly those dots to where the picture sits in the text. */
const pics=new Map(); let picCount=0;   // picture id -> {height, data} (see rasterize)
const isPic=el=>!!el&&el.classList.contains('pic');
function insertPic(bits){
  const id=String(++picCount), el=document.createElement('div'), c=mkCanvas(PW,bits.height), rm=document.createElement('button');
  pics.set(id,bits); showBits(bits,c);
  el.className='pic'; el.contentEditable='false'; el.dataset.pic=id;
  rm.className='rm'; rm.setAttribute('aria-label','Remove picture'); el.append(c,rm);
  // At the cursor's line; with no cursor in the text, at the end.
  let line=savedSel&&doc.contains(savedSel.startContainer)?lineAt(savedSel.startContainer,savedSel.startOffset):null;
  if(!line)line=doc.lastElementChild;
  // An empty line gives its place to the picture and moves below it. A line with text (or the Title line) keeps its place.
  const takePlace=line&&!isPic(line)&&!line.textContent&&line.dataset.ph!==TITLE_HINT;
  if(!line)doc.append(el); else if(takePlace)line.before(el); else line.after(el);
  // There is always a line to type on after a picture
  let next=el.nextElementSibling;
  if(!next||isPic(next)){next=document.createElement('div'); next.innerHTML='<br>'; el.after(next)}
  doc.focus(); caretTo(next); tidy();
}
doc.addEventListener('click',e=>{
  const rm=e.target.closest('.pic .rm'); if(!rm)return;
  pics.delete(rm.parentElement.dataset.pic); rm.parentElement.remove(); tidy();
});
/* The line (direct child of the text box) that a node is in. */
function lineAt(node,offset=0){
  if(node===doc)node=doc.childNodes[Math.min(offset,doc.childNodes.length-1)];
  while(node&&node.parentNode!==doc)node=node.parentNode;
  return node&&node.nodeType===1?node:null;
}
function caretTo(el){
  const r=document.createRange(); r.setStart(el,0); r.collapse(true);
  const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); savedSel=r.cloneRange();
}
/* Run one formatting command on the selected text (or on what is typed next). */
function format(cmd,val){
  // Use the selection in the text. If a toolbar menu took the cursor away, put it back where it was.
  const sel=getSelection();
  if(!(document.activeElement===doc&&sel.rangeCount&&doc.contains(sel.anchorNode))){
    doc.focus(); if(savedSel){sel.removeAllRanges();sel.addRange(savedSel)}
  }
  const at=sel.rangeCount?sel.getRangeAt(0):null;
  // On an empty line, style the line itself, so its faded hint and whatever is typed there both change.
  const line=at&&at.collapsed?lineAt(at.startContainer,at.startOffset):null, st=line&&!line.textContent?line.style:null, cs=st&&getComputedStyle(line);
  if(st&&!cmd.startsWith('justify')){
    if(cmd==='fontName')st.fontFamily=`"${val}"`;
    if(cmd==='fontSize')st.fontSize=sizePx+'px';
    if(cmd==='bold')st.fontWeight=parseInt(cs.fontWeight)>=600?'400':'700';
    if(cmd==='italic')st.fontStyle=cs.fontStyle==='italic'?'normal':'italic';
    if(cmd==='underline')st.textDecorationLine=cs.textDecorationLine.includes('underline')?'none':'underline';
    line.innerHTML='<br>'; caretTo(line);
  }else{
    document.execCommand('styleWithCSS',false,cmd!=='fontSize');
    document.execCommand(cmd,false,val);
  }

}
/* Make the toolbar show the style at the cursor. */
function showState(){
  const sel=getSelection(); if(!sel.rangeCount||!doc.contains(sel.anchorNode))return;
  const r=sel.getRangeAt(0), el=sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement, cs=getComputedStyle(el);
  let fam=''; try{fam=document.queryCommandValue('fontName')}catch(e){}
  const f=FONTS.find(f=>fam.includes(f.name))||FONTS.find(f=>cs.fontFamily.includes(f.name)); if(f)$('fFont').value=f.name;
  // a size picked with nothing selected only applies to what is typed next: keep showing it until the cursor moves
  if(!(sizeHold&&r.collapsed&&r.startContainer===sizeHold.node&&r.startOffset===sizeHold.at)){
    sizeHold=null; const pt=parseFloat(cs.fontSize)/DOTS_PER_PT;
    $('fSize').value=SIZES.reduce((a,b)=>Math.abs(b-pt)<Math.abs(a-pt)?b:a);
  }
  $('tools').querySelectorAll('button').forEach(b=>{let on=false; try{on=document.queryCommandState(b.dataset.cmd)}catch(e){} b.classList.toggle('on',on)});
}
$('fFont').innerHTML=FONTS.map(f=>`<option>${f.name}</option>`).join('');
$('fSize').innerHTML=SIZES.map(p=>`<option>${p}</option>`).join(''); $('fSize').value=10;
$('fFont').onchange=e=>headerSelected?saveSettings({header_font:e.target.value}):format('fontName',e.target.value);
$('fSize').onchange=e=>{
  sizePx=Math.round(e.target.value*DOTS_PER_PT);
  sizeHold=savedSel&&savedSel.collapsed?{node:savedSel.startContainer,at:savedSel.startOffset}:null;
  format('fontSize',7);
